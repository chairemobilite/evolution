[tool.poetry]
name = "generator"
version = "0.1.0"
description = ""
authors = ["Samuel Duhaime-Morissette <sduhaimemorissette@gmail.com>"]
readme = "README.md"
packages = [{include = "scripts", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12.0"
certifi = "2026.10.19"
charset-normalizer = "3.3.2"
et-xmlfile = "1.1.0"
idna = "3.15"
msal = "1.39.0"
office365-rest-python-client = "2.5.2"
openpyxl = "3.1.2"
pyjwt = "2.15.0"
python-dotenv = "1.2.2"
pytz = "2023.3.post1"
pyyaml = "6.0.1"
requests = "2.33.0"
ruamel-yaml = "0.18.5"
ruamel-yaml-clib = "0.2.8"
typing-extensions = "^4.8.0"
urllib3 = "2.8.0"
pydantic = "^2.13.5"

[tool.poetry.scripts]
generateSurvey = "scripts.generate_survey:main"
verifyExcel = "scripts.generate_survey:verify_excel_cli_main"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
