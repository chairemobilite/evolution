# This workflow is used to run the UI test for the Demo-Generator application.

name: Generator UI Test

on:
  push:
    branches: [ main ]
  # We are not running on Pull Request, since we need the Google API Key
  # Manual runs let a maintainer test a branch before merging it. Only users
  # with write access can start them, so the Google API Key stays protected.
  # Run from the Actions tab (Generator UI Test > Run workflow > pick the
  # branch) or with: gh workflow run generator-ui-test.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-build-and-test:
    runs-on: ubuntu-24.04 # As of Nov 2024, ubuntu-latest is too old for poetry
    services:
      postgres:
        image: postgis/postgis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
    strategy:
      matrix:
        node-version: [24.x]
    env:
      PROJECT_CONFIG: ${{ github.workspace }}/example/demo_generator/config.js
      PG_CONNECTION_STRING_PREFIX: postgres://testuser:testpassword@localhost:5432/
      PG_DATABASE_PRODUCTION: testdb
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      CI: true ## This is to make sure that the tests run in CI mode
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: copy env file
      run: cp .env.example .env
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - name: Use Python 3.14
      # Only test the latest version used by GitHub runners, since this workflow is long and uses the Google API Key.
      # The 'CI-Generator' workflow already tests the Python versions supported by the generator.
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install poetry
      run: pipx install poetry
    - name: Run Poetry
      working-directory: packages/evolution-generator
      run: |
        poetry env use python3.14
        poetry install
    - name: Enable Corepack
      # Corepack runs the Yarn version set in package.json. Node.js 25+ no longer bundles it.
      run: npm install -g corepack
    - name: Install
      # Yarn 4 needs the project to be installed before running scripts
      run: yarn
    - name: Generate survey
      run: yarn generateSurvey:generator
    - name: Format python
      run: yarn format:python
    - name: Check git status after python format
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Code formatting issues found. Please run 'yarn format' locally and commit changes."
          git status
          git diff
          exit 1
        fi
    - name: Compile Evolution
      run: yarn compile
    - name: Compile Generated survey
      run: yarn compile:generator
    - name: Build Client bundle
      run: yarn build:prod:generator
      # Skipped build:admin:generator since we don't have UI for them at the moment
    - name: Create DB
      run: yarn setup && yarn migrate
      env:
        NODE_ENV: production
    - name: Get Playwright config
      run: cp packages/evolution-frontend/playwright-example.config.ts example/demo_generator/playwright.config.ts
    - name: Start application
      run: yarn start:generator &
      env:
        NODE_ENV: production
    - name: Run UI test
      run: yarn test:ui:generator
    - name: Archive UI Test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-results-${{matrix.node-version}} # This is to make sure that the results are stored in a unique name
        path: example/demo_generator/test-results
        retention-days: 2
      # End of automated UI test

